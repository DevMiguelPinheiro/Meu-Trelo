version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - WDS_SOCKET_PORT=0
      - NODE_ENV=development
    networks:
      - mytrello-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - MONGODB_URI=mongodb://db:27017/mytrello
      - MONGODB_NAME=mytrello
      - NODE_ENV=development
      - PORT=5000
    networks:
      - mytrello-network
    depends_on:
      - db

  db:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mytrello-network

volumes:
  mongodb_data:
  frontend_node_modules:
  backend_node_modules:

networks:
  mytrello-network:
    driver: bridge 