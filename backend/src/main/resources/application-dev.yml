spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/mytrello}
      database: ${SPRING_DATA_MONGODB_DATABASE:mytrello}
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

server:
  port: 8080

logging:
  level:
    root: INFO
    com.mytrello: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG 