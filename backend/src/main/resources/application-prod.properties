# Server Configuration
server.port=5000

# MongoDB Configuration
spring.data.mongodb.host=mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=mytrello
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.connection-pool-size=100
spring.data.mongodb.connection-timeout=5000
spring.data.mongodb.socket-timeout=3000
spring.data.mongodb.max-wait-time=1500

# Logging Configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.mytrello=DEBUG

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always 